- aid: temlavo:temlavo-documents-api
  name: Temlavo Documents API
  description: Invoice document operations of the Temlavo Invoice Extraction API (OpenAPI 3.1, version 1.0.0) —
    create an invoice document and receive an upload authorization, confirm a direct upload so it is admitted
    for processing, retrieve the document resource with its extracted data, consistency checks and duplicate
    signals, and delete a document with its retained customer content. Bearer API key authentication.

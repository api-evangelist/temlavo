    operations (createDocument, completeDocumentUpload, getDocument, deleteDocument, getUsage), bearer API key
    security, no tags. https://temlavo.com/docs, https://temlavo.com/docs/api-reference, https://temlavo.com/schemas/invoice.v1.json
    and https://temlavo.com/llms.txt all return 200; an invented /docs path returns a real 404. https://api.temlavo.com/

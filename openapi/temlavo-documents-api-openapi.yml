      type: string
      format: uri
      pattern: ^https:\/\/.*
      description: Public HTTPS URL without embedded username or password credentials
    UploadCompleteRequest:
      type: object
      properties: {}
      additionalProperties: false
    CallbackUrl:
      type: string
      description: HTTPS callback URL using a DNS hostname and port 443, with 1..2048 Unicode code points, no fragment, no surrounding whitespace, no embedded credentials, and no Cc/U+2028/U+2029 control characters
      minLength: 1
      maxLength: 2048
      format: uri
      pattern: ^[Hh][Tt][Tt][Pp][Ss]://
    CustomerMetadata:
      type: object
      propertyNames:
        type: string
        pattern: ^[A-Za-z0-9_.-]+$
        description: Metadata key containing 1..64 ASCII letters, digits, _, ., or -
        minLength: 1
        maxLength: 64
      additionalProperties:
        type: string
        description: Opaque string preserved exactly, limited to 500 Unicode code points and required to be single-line/control-free (no Cc/U+2028/U+2029)
        maxLength: 500
      maxProperties: 10

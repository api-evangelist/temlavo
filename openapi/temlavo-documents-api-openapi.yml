openapi: 3.2.0
info:
  title: Temlavo Invoice Extraction Documents API
  version: 1.0.0
  description: AI-extracted invoice data with practical consistency checks, duplicate signals, and predictable asynchronous integration.
servers:
- url: https://api.temlavo.com
tags:
- name: Documents
paths:
  /v1/documents:
    post:
      operationId: createDocument
      summary: Create an invoice document and upload authorization
      security:
      - ApiKeyAuth: []
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
        required: false
        description: Optional idempotency key for resource creation
      - in: header
        name: Temlavo-Upload-Recovery
        schema:
          type: string
          const: confirm-existing
        required: false
        description: 'Opt in to upload: null on an exact awaiting replay whose source already exists. Confirm with upload-complete before any PUT; create never admits processing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '200':
          description: Current document returned for an exact idempotent replay
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
              description: Prevents caching of signed capabilities and one-time secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDocumentReplayResponse'
        '201':
          description: Document created
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
              description: Prevents caching of signed capabilities and one-time secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDocumentResponse'
        '400':
          description: Invalid request
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid API key
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: Processing entitlement required
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Idempotency conflict
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: Upload reservation expired
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Document too large
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Unsupported content type
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Retry-After:
              required: true
              description: Seconds to wait before retrying or polling
              schema:
                type: string
                description: Seconds to wait before retrying or polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Retry-After:
              schema:
                type: string
                description: Seconds to wait before retrying or polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
      - Documents
  /v1/documents/{document_id}/upload-complete:
    post:
      operationId: completeDocumentUpload
      summary: Confirm a direct upload and admit it for processing
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: document_id
        schema:
          $ref: '#/components/schemas/DocumentId'
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompleteRequest'
      responses:
        '200':
          description: Current document returned for an idempotent replay
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
              description: Prevents caching of signed capabilities and one-time secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCompleteReplayResponse'
        '202':
          description: Document admitted for processing
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
              description: Prevents caching of signed capabilities and one-time secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCompleteAcceptedResponse'
        '400':
          description: Invalid request
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid API key
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: Processing entitlement required
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Document not found
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Upload incomplete or document state conflict
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: Upload reservation expired
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Document too large
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Unsupported content type
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Uploaded object size does not match the declaration
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Retry-After:
              required: true
              description: Seconds to wait before retrying or polling
              schema:
                type: string
                description: Seconds to wait before retrying or polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Retry-After:
              schema:
                type: string
                description: Seconds to wait before retrying or polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
      - Documents
  /v1/documents/{document_id}:
    get:
      operationId: getDocument
      summary: Retrieve the current document resource
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: document_id
        schema:
          $ref: '#/components/schemas/DocumentId'
        required: true
      responses:
        '200':
          description: Current document resource
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
              description: Prevents caching of signed capabilities and one-time secrets
            Retry-After:
              schema:
                type: string
                description: Seconds to wait before retrying or polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Invalid API key
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Document not found
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: Document expired
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Retry-After:
              required: true
              description: Seconds to wait before retrying or polling
              schema:
                type: string
                description: Seconds to wait before retrying or polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
      - Documents
    delete:
      operationId: deleteDocument
      summary: Delete a document and its retained customer content
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: document_id
        schema:
          $ref: '#/components/schemas/DocumentId'
        required: true
      responses:
        '204':
          description: No content
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
        '401':
          description: Invalid API key
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Document not found
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded
          headers:
            X-Request-Id:
              required: true
              description: Request identifier for support and diagnostics
              schema:
                description: Request identifier for support and diagnostics
                $ref: '#/components/schemas/RequestId'
            Retry-After:
              required: true
              description: Seconds to wait before retrying or polling
              schema:
                type: string
                description: Seconds to wait before retrying or polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
      - Documents
components:
  schemas:
    ConfirmExistingUploadResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DocumentId'
        object:
          type: string
          const: document
        status:
          type: string
          const: awaiting_upload
        document_type:
          type: string
          const: invoice
        schema_version:
          type: string
          const: invoice.v1
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        external_id:
          anyOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        accounting_entity_id:
          anyOf:
          - $ref: '#/components/schemas/AccountingEntityId'
          - type: 'null'
        policy:
          $ref: '#/components/schemas/DocumentPolicy'
        upload:
          type: 'null'
        callback:
          anyOf:
          - $ref: '#/components/schemas/CallbackDeliverySummary'
          - type: 'null'
        metadata:
          $ref: '#/components/schemas/CustomerMetadata'
      required:
      - id
      - object
      - status
      - document_type
      - schema_version
      - created_at
      - external_id
      - accounting_entity_id
      - policy
      - upload
      - callback
      - metadata
      additionalProperties: true
    InvoiceTotals:
      type: object
      properties:
        subtotal:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        discount:
          anyOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          - type: 'null'
        shipping:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        other_charges:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        tax:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        total:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        amount_due:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      required:
      - subtotal
      - discount
      - shipping
      - other_charges
      - tax
      - total
      - amount_due
      additionalProperties: false
    LineTax:
      type: object
      properties:
        label:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        rate:
          anyOf:
          - $ref: '#/components/schemas/NonNegativeDecimalString'
          - type: 'null'
        amount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      required:
      - label
      - rate
      - amount
      additionalProperties: false
    NonNegativeDecimalString:
      type: string
      pattern: ^\+?\d+(?:\.\d+)?$
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
    __schema0:
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          $ref: '#/components/schemas/__schema0'
      - type: object
        propertyNames:
          type: string
        additionalProperties:
          $ref: '#/components/schemas/__schema0'
    ResultDocumentDescriptor:
      type: object
      properties:
        filename:
          $ref: '#/components/schemas/Filename'
        content_type:
          $ref: '#/components/schemas/SourceContentType'
        page_count:
          type: integer
          minimum: 1
          maximum: 20
      required:
      - filename
      - content_type
      - page_count
      additionalProperties: true
    CreateDocumentReplayResponse:
      anyOf:
      - $ref: '#/components/schemas/CreateDocumentResponse'
      - $ref: '#/components/schemas/ConfirmExistingUploadResponse'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/DocumentId'
          object:
            type: string
            const: document
          document_type:
            type: string
            const: invoice
          schema_version:
            type: string
            const: invoice.v1
          created_at:
            $ref: '#/components/schemas/UtcDateTime'
          external_id:
            anyOf:
            - $ref: '#/components/schemas/ExternalId'
            - type: 'null'
          accounting_entity_id:
            anyOf:
            - $ref: '#/components/schemas/AccountingEntityId'
            - type: 'null'
          policy:
            $ref: '#/components/schemas/DocumentPolicy'
          callback:
            anyOf:
            - $ref: '#/components/schemas/CallbackDeliverySummary'
            - type: 'null'
          metadata:
            $ref: '#/components/schemas/CustomerMetadata'
          status:
            type: string
            const: queued
        required:
        - id
        - object
        - document_type
        - schema_version
        - created_at
        - external_id
        - accounting_entity_id
        - policy
        - callback
        - metadata
        - status
        additionalProperties: true
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/DocumentId'
          object:
            type: string
            const: document
          document_type:
            type: string
            const: invoice
          schema_version:
            type: string
            const: invoice.v1
          created_at:
            $ref: '#/components/schemas/UtcDateTime'
          external_id:
            anyOf:
            - $ref: '#/components/schemas/ExternalId'
            - type: 'null'
          accounting_entity_id:
            anyOf:
            - $ref: '#/components/schemas/AccountingEntityId'
            - type: 'null'
          policy:
            $ref: '#/components/schemas/DocumentPolicy'
          callback:
            anyOf:
            - $ref: '#/components/schemas/CallbackDeliverySummary'
            - type: 'null'
          metadata:
            $ref: '#/components/schemas/CustomerMetadata'
          status:
            type: string
            const: processing
        required:
        - id
        - object
        - document_type
        - schema_version
        - created_at
        - external_id
        - accounting_entity_id
        - policy
        - callback
        - metadata
        - status
        additionalProperties: true
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/DocumentId'
          object:
            type: string
            const: document
          document_type:
            type: string
            const: invoice
          schema_version:
            type: string
            const: invoice.v1
          created_at:
            $ref: '#/components/schemas/UtcDateTime'
          external_id:
            anyOf:
            - $ref: '#/components/schemas/ExternalId'
            - type: 'null'
          accounting_entity_id:
            anyOf:
            - $ref: '#/components/schemas/AccountingEntityId'
            - type: 'null'
          policy:
            $ref: '#/components/schemas/DocumentPolicy'
          callback:
            anyOf:
            - $ref: '#/components/schemas/CallbackDeliverySummary'
            - type: 'null'
          metadata:
            $ref: '#/components/schemas/CustomerMetadata'
          status:
            type: string
            const: completed
          completed_at:
            $ref: '#/components/schemas/UtcDateTime'
          document:
            $ref: '#/components/schemas/ResultDocumentDescriptor'
          data:
            $ref: '#/components/schemas/InvoiceDataV1'
          validation:
            $ref: '#/components/schemas/Validation'
          processing:
            $ref: '#/components/schemas/ProcessingMetadata'
        required:
        - id
        - object
        - document_type
        - schema_version
        - created_at
        - external_id
        - accounting_entity_id
        - policy
        - callback
        - metadata
        - status
        - completed_at
        - document
        - data
        - validation
        - processing
        additionalProperties: true
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/DocumentId'
          object:
            type: string
            const: document
          document_type:
            type: string
            const: invoice
          schema_version:
            type: string
            const: invoice.v1
          created_at:
            $ref: '#/components/schemas/UtcDateTime'
          external_id:
            anyOf:
            - $ref: '#/components/schemas/ExternalId'
            - type: 'null'
          accounting_entity_id:
            anyOf:
            - $ref: '#/components/schemas/AccountingEntityId'
            - type: 'null'
          policy:
            $ref: '#/components/schemas/DocumentPolicy'
          callback:
            anyOf:
            - $ref: '#/components/schemas/CallbackDeliverySummary'
            - type: 'null'
          metadata:
            $ref: '#/components/schemas/CustomerMetadata'
          status:
            type: string
            const: needs_review
          completed_at:
            $ref: '#/components/schemas/UtcDateTime'
          document:
            $ref: '#/components/schemas/ResultDocumentDescriptor'
          data:
            $ref: '#/components/schemas/InvoiceDataV1'
          validation:
            $ref: '#/components/schemas/Validation'
          processing:
            $ref: '#/components/schemas/ProcessingMetadata'
        required:
        - id
        - object
        - document_type
        - schema_version
        - created_at
        - external_id
        - accounting_entity_id
        - policy
        - callback
        - metadata
        - status
        - completed_at
        - document
        - data
        - validation
        - processing
        additionalProperties: true
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/DocumentId'
          object:
            type: string
            const: document
          document_type:
            type: string
            const: invoice
          schema_version:
            type: string
            const: invoice.v1
          created_at:
            $ref: '#/components/schemas/UtcDateTime'
          external_id:
            anyOf:
            - $ref: '#/components/schemas/ExternalId'
            - type: 'null'
          accounting_entity_id:
            anyOf:
            - $ref: '#/components/schemas/AccountingEntityId'
            - type: 'null'
          policy:
            $ref: '#/components/schemas/DocumentPolicy'
          callback:
            anyOf:
            - $ref: '#/components/schemas/CallbackDeliverySummary'
            - type: 'null'
          metadata:
            $ref: '#/components/schemas/CustomerMetadata'
          status:
            type: string
            const: failed
          completed_at:
            $ref: '#/components/schemas/UtcDateTime'
          document:
            $ref: '#/components/schemas/FailedDocumentDescriptor'
          error:
            $ref: '#/components/schemas/AsyncDocumentError'
        required:
        - id
        - object
